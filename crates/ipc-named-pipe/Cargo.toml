cargo-features = ["profile-rustflags"]

[package]
name = "ipc-named-pipe"
version = "0.1.0"
edition = "2024"

[dependencies]
win-platform = { path = "../win-platform", features = ["alloc"] }
allocator = { path = "../allocator" }
logger = { path = "../logger" }
log = "0.4.34"
compiler-builtins = { path = "../compiler-builtins" }
ntapi = { version = "0.4.3"}
heapless = "0.9.3"
postcard = { version = "1.1.3", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
spin = "0.12.3"

[dependencies.winapi]
version = "0.3.9"
features = [
    "impl-debug",
    "synchapi",
    "securitybaseapi", "consoleapi", "winbase", "fileapi", "errhandlingapi", "minwinbase", "libloaderapi"
]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "z"          
lto = false
codegen-units = 1        
debug = false            
debug-assertions = false 
overflow-checks = false  
incremental = false      
strip = "debuginfo"
rustflags = [
    "-C", "link-arg=/DEBUG:NONE",
    "-C", "link-arg=/EMITPOGOPHASEINFO",
    "-C", "link-arg=/OPT:REF",
    "-C", "link-arg=/OPT:ICF",
    # "-C", "link-arg=/MERGE:.rdata=.text",
]