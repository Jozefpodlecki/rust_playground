
[package]
name = "win-platform"
version = "0.1.0"
edition = "2024"

[dependencies]
ntapi = { version = "0.4.3"}
heapless = "0.9.3"
log = { version = "0.4", optional = true }

[dependencies.winapi]
version = "0.3.9"
features = [
    "impl-debug",
    "synchapi",
    "securitybaseapi", "consoleapi", "winbase", "fileapi", "errhandlingapi", "minwinbase", "libloaderapi"
]

[features]
default = []
log = ["dep:log"]
alloc = []