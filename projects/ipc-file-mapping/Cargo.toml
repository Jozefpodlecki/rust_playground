cargo-features = ["profile-rustflags"]

[package]
name = "ipc-file-mapping"
version = "0.1.0"
edition = "2024"

[dependencies]
toolkit = { path = "../../toolkit" }
builtins = { path = "../../builtins" }
ntapi = { version = "0.4.3", features = [] }
winapi = { version = "*", features = [
    "profileapi",
    "shobjidl_core",
    "shellapi", 
    "jobapi2",
    "errhandlingapi",
    "minwinbase",
    "winbase",
    "libloaderapi",
    "memoryapi",
    "synchapi",
    "handleapi",
    "fileapi", 
    "namedpipeapi"
] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "z"          
lto = false
codegen-units = 1        
debug = false            
debug-assertions = false 
overflow-checks = false  
incremental = false      
strip = "debuginfo"
rustflags = [
    "-C", "link-arg=/DEBUG:NONE",
    "-C", "link-arg=/EMITPOGOPHASEINFO",
    "-C", "link-arg=/OPT:REF",
    "-C", "link-arg=/OPT:ICF",
    # "-C", "link-arg=/MERGE:.rdata=.text",
]