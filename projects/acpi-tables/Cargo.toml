cargo-features = ["profile-rustflags"]

[package]
name = "acpi-tables"
version = "0.1.0"
edition = "2024"

[dependencies]
ntapi = { version = "0.4.3"}
toolkit = { path = "../../toolkit" }
builtins = { path = "../../builtins" }
winapi = { version = "0.3.9", features = [
    "sysinfoapi" ,
    "impl-debug", "synchapi", "securitybaseapi",
    "consoleapi", "winbase", "fileapi", "errhandlingapi", "minwinbase", "libloaderapi"
    ] }
acpi = "6.1.1"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "z"          
lto = false
codegen-units = 1        
debug = false            
debug-assertions = false 
overflow-checks = false  
incremental = false      
strip = "debuginfo"
rustflags = [
    "-C", "link-arg=/DEBUG:NONE",
    "-C", "link-arg=/EMITPOGOPHASEINFO",
    "-C", "link-arg=/OPT:REF",
    "-C", "link-arg=/OPT:ICF",
    # "-C", "link-arg=/MERGE:.rdata=.text",
]