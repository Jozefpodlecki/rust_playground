cargo-features = ["profile-rustflags"]

[package]
name = "search-directory"
version = "0.1.0"
edition = "2024"

[dependencies]
emballoc = "0.3.0"
ntapi = "0.4.3"
builtins = { path = "../../builtins" }
toolkit = { path = "../../toolkit" }
heapless = "0.9.3"

[dependencies.winapi]
version = "0.3.9"
features = [
    "fileapi",      # CreateFileW, CloseHandle
    "winnt",        # GENERIC_READ, FILE_SHARE_READ, FILE_SHARE_WRITE, etc.
    "winbase",      # OPEN_EXISTING, FILE_FLAG_BACKUP_SEMANTICS
    "ioapiset",     # DeviceIoControl
    "winioctl",     # FSCTL_QUERY_USN_JOURNAL, FSCTL_ENUM_USN_DATA, USN_JOURNAL_DATA, MFT_ENUM_DATA, USN_RECORD
    "handleapi",    # CloseHandle
    "minwindef",    # DWORD, etc.
]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "z"          
lto = false
codegen-units = 1        
debug = false            
debug-assertions = false 
overflow-checks = false  
incremental = false      
strip = "debuginfo"
rustflags = [
    "-C", "link-arg=/DEBUG:NONE",
    "-C", "link-arg=/EMITPOGOPHASEINFO",
    "-C", "link-arg=/OPT:REF",
    "-C", "link-arg=/OPT:ICF",
    # "-C", "link-arg=/MERGE:.rdata=.text",
]