cargo-features = ["profile-rustflags"]

[package]
name = "nt-version"
version = "0.1.0"
edition = "2024"

[dependencies]
toolkit = { path = "../../toolkit" }
builtins = { path = "../../builtins" }
ntapi = { version = "0.4.3", features = [] }
winapi = { version = "0.3.9", features = ["impl-debug", "synchapi", "securitybaseapi", "consoleapi", "winbase", "fileapi", "errhandlingapi", "minwinbase", "libloaderapi"] }
widestring = { version = "1.2.1", default-features = false, features = ["alloc"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "z"          
lto = false
codegen-units = 1        
debug = false            
debug-assertions = false 
overflow-checks = false  
incremental = false      
strip = "debuginfo"
rustflags = [
    "-C", "link-arg=/DEBUG:NONE",
    "-C", "link-arg=/EMITPOGOPHASEINFO",
    "-C", "link-arg=/OPT:REF",
    "-C", "link-arg=/OPT:ICF",
    # "-C", "link-arg=/MERGE:.rdata=.text",
]